name: Sync repo từ fastsign.dev

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tải repo.json
        run: curl -L -o repo.json https://fastsign.dev/repo.json

      - name: Sửa metadata
        run: |
          sed -i 's/"name": "Alan'\''s Gigantic Repo"/"name": "Plat • Dex"/g' repo.json
          sed -i 's/"identifier": "dev.fastsign.repo"/"identifier": "com.platdex.repo"/g' repo.json
          sed -i 's|"sourceURL": "https://fastsign.dev/repo.json"|"sourceURL": "https://plat-dexx.github.io/repo-platdex/repo.json"|g' repo.json
          sed -i 's|"website": "https://fastsign.dev"|"website": "https://plat-dexx.github.io/repo-platdex/"|g' repo.json
          sed -i 's|"iconURL": "https://fastsign.dev/icon.png"|"iconURL": "https://plat-dexx.github.io/repo-platdex/icon.PNG"|g' repo.json
          sed -i 's/"repoName": "Alan'\''s Gigantic Repo"/"repoName": "Plat • Dex"/g' repo.json
          sed -i 's|"repoIcon": "https://fastsign.dev/icon.png"|"repoIcon": "https://plat-dexx.github.io/repo-platdex/icon.PNG"|g' repo.json

      - name: Commit và push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add repo.json
            git commit -m "Tự động đồng bộ từ fastsign.dev"
            git push
          else
            echo "Không có thay đổi để commit"
          fi
